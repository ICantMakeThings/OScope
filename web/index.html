<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>OScope Control</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef1e8;
      --muted: #9da69a;
      --faint: #677269;
      --canvas: #111714;
      --surface: #19211d;
      --surface-raised: #202a24;
      --line: #344139;
      --lime: #cbf36a;
      --cyan: #77d7d2;
      --coral: #f29a76;
      --display: "Bahnschrift", "Aptos Display", "Trebuchet MS", sans-serif;
      --body: "Aptos", "Trebuchet MS", sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--canvas);
      background-image: linear-gradient(90deg, transparent 49px, #26312a 50px, transparent 51px),
                        linear-gradient(#1b251f 1px, transparent 1px);
      background-size: 100% 100%, 100% 34px;
      font-family: var(--body);
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1120px, 100%); margin: 0 auto; padding: 0 34px 54px; }
    .topbar {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      color: var(--canvas); background: var(--lime); font: 700 17px var(--mono);
      clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 100%, 0 100%);
    }
    .brand-name { font: 700 18px var(--display); }
    .brand-meta { color: var(--muted); font: 11px var(--mono); margin-top: 4px; }
    .connection { display: flex; align-items: center; gap: 9px; color: var(--muted); font: 12px var(--mono); }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
    .connection.online .connection-dot { background: var(--lime); box-shadow: 0 0 12px #cbf36a77; }
    .connection.offline .connection-dot { background: var(--coral); }
    .device-strip {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 27px 0 22px; border-bottom: 1px solid var(--line);
    }
    .eyebrow { color: var(--cyan); font: 11px var(--mono); text-transform: uppercase; }
    h1 { margin: 7px 0 0; font: 600 29px var(--display); }
    .mode-readout { text-align: right; font: 12px var(--mono); color: var(--muted); }
    .mode-readout strong { display: block; color: var(--ink); font-weight: 500; margin-top: 6px; }
    .workspace { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 42px; padding-top: 28px; }
    .tabs { display: flex; flex-direction: column; gap: 5px; }
    .tab {
      min-height: 45px; border: 1px solid transparent; background: transparent; text-align: left;
      padding: 0 13px; color: var(--muted); cursor: pointer; border-radius: 3px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .tab:hover { color: var(--ink); background: #ffffff08; }
    .tab[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--line); }
    .tab-code { color: var(--faint); font: 10px var(--mono); }
    .tab[aria-selected="true"] .tab-code { color: var(--lime); }
    .sidebar-note { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 15px; color: var(--muted); font: 11px/1.8 var(--mono); }
    .sidebar-note strong { display: block; color: var(--ink); font-weight: 500; }
    .content { min-width: 0; }
    .view { display: none; animation: arrive 180ms ease-out; }
    .view.active { display: block; }
    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 2px 0 14px; }
    h2 { margin: 0; font: 600 17px var(--display); }
    .section-index { color: var(--faint); font: 10px var(--mono); }
    .group { margin-bottom: 29px; }
    .group-title {
      margin: 0; padding: 0 0 9px; border-bottom: 1px solid var(--line);
      color: var(--muted); font: 10px var(--mono); text-transform: uppercase;
    }
    .setting-row {
      min-height: 55px; display: flex; align-items: center; justify-content: space-between;
      gap: 20px; border-bottom: 1px solid #34413988;
    }
    .setting-name { font-size: 13px; }
    .setting-value { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
    .toggle {
      position: relative; flex: 0 0 39px; width: 39px; height: 22px; border: 1px solid #657067;
      border-radius: 20px; background: #313a34; cursor: pointer; transition: background 140ms, border-color 140ms;
    }
    .toggle::after {
      content: ""; position: absolute; width: 14px; height: 14px; top: 3px; left: 3px;
      border-radius: 50%; background: #cad1c9; transition: transform 140ms, background 140ms;
    }
    .toggle[aria-checked="true"] { background: #748f34; border-color: var(--lime); }
    .toggle[aria-checked="true"]::after { transform: translateX(17px); background: var(--lime); }
    .range-wrap { width: min(57%, 330px); display: grid; grid-template-columns: minmax(80px, 1fr) 50px; align-items: center; gap: 13px; }
    input[type="range"] { width: 100%; height: 4px; margin: 0; accent-color: var(--lime); cursor: pointer; }
    output { color: var(--lime); text-align: right; font: 11px var(--mono); }
    select {
      min-width: min(320px, 55%); max-width: 55%; min-height: 37px; padding: 0 32px 0 11px;
      color: var(--ink); background: var(--surface-raised); border: 1px solid var(--line); border-radius: 3px;
    }
    select:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .empty { color: var(--muted); font-size: 13px; padding: 22px 0; }
    .footer-line { display: flex; justify-content: space-between; gap: 20px; margin-top: 12px; color: var(--faint); font: 10px var(--mono); }
    #toast { position: fixed; right: 22px; bottom: 20px; max-width: min(420px, calc(100vw - 44px)); padding: 11px 14px; border-left: 3px solid var(--coral); background: var(--surface-raised); color: var(--ink); font-size: 12px; opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity 160ms, transform 160ms; }
    #toast.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 700px) {
      .shell { padding: 0 18px 36px; }
      .topbar { min-height: 72px; }
      .device-strip { align-items: flex-end; padding: 21px 0 17px; }
      h1 { font-size: 25px; }
      .workspace { display: block; padding-top: 19px; }
      .tabs { flex-direction: row; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 23px; }
      .tab { flex: 1; min-width: 105px; justify-content: center; gap: 8px; padding: 0 9px; }
      .sidebar-note { display: none; }
      .setting-row { gap: 12px; }
      .setting-name { font-size: 12px; }
      .range-wrap { width: 58%; grid-template-columns: minmax(45px, 1fr) 42px; gap: 8px; }
      select { min-width: 0; width: 58%; max-width: 58%; font-size: 12px; }
      .mode-readout { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">O</div>
        <div><div class="brand-name">OSCOPE</div><div class="brand-meta">DEVICE CONTROL / <span id="device-host">LAN</span></div></div>
      </div>
      <div class="connection" id="connection" role="status"><span class="connection-dot"></span><span id="connection-label">CONNECTING</span></div>
    </header>
    <section class="device-strip">
      <div><div class="eyebrow">Live system</div><h1 id="view-title">Detection</h1></div>
      <div class="mode-readout">ACTIVE CAMERA<strong id="camera-readout">Waiting for camera</strong></div>
    </section>
    <div class="workspace">
      <aside>
        <nav class="tabs" aria-label="Settings sections">
          <button class="tab" type="button" data-view="detection" aria-selected="true"><span>Detection</span><span class="tab-code">01</span></button>
          <button class="tab" type="button" data-view="camera" aria-selected="false"><span>Camera</span><span class="tab-code">02</span></button>
          <button class="tab" type="button" data-view="alerts" aria-selected="false"><span>Alerts</span><span class="tab-code">03</span></button>
        </nav>
        <div class="sidebar-note"><strong id="led-status">GPIO LED / OFF</strong>Control link<br><span id="link-status">Waiting for device</span></div>
      </aside>
      <main class="content" id="views" aria-live="polite"></main>
    </div>
    <div class="footer-line"><span>OSCOPE / RADXA</span><span id="updated-at">Awaiting state</span></div>
  </div>
  <div id="toast" role="status"></div>
  <script>
    const viewNames = { detection: "Detection", camera: "Camera", alerts: "Alerts" };
    const detectionToggles = ["Humans", "Animals", "Balls", "Cars / vehicles", "Other objects", "Drones", "Lite gun"];
    let latestState = null;
    let activeView = "detection";
    let toastTimer;

    const element = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    function group(parent, title) {
      const section = element("section", "group");
      section.append(element("h3", "group-title", title));
      parent.append(section);
      return section;
    }

    function toggleRow(parent, label, name, action = "toggle") {
      const row = element("div", "setting-row");
      row.append(element("span", "setting-name", label));
      const button = element("button", "toggle");
      button.type = "button";
      button.setAttribute("role", "switch");
      button.setAttribute("aria-label", label);
      button.dataset[action === "toggle" ? "toggle" : "cameraToggle"] = name;
      button.addEventListener("click", () => {
        const isOn = button.getAttribute("aria-checked") === "true";
        if (action === "toggle") send({ action, name, value: !isOn });
        else send({ action: "camera_control", name, value: isOn ? 0 : 1 });
      });
      row.append(button);
      parent.append(row);
    }

    function rangeRow(parent, label, key, minimum, maximum, step, suffix = "", digits = 0, action = "setting") {
      const row = element("div", "setting-row");
      row.append(element("label", "setting-name", label));
      const wrap = element("div", "range-wrap");
      const slider = document.createElement("input");
      slider.type = "range";
      slider.min = minimum;
      slider.max = maximum;
      slider.step = step;
      slider.dataset[action === "setting" ? "setting" : "cameraControl"] = key;
      const output = document.createElement("output");
      output.htmlFor = slider.id = `control-${action}-${key}`;
      slider.setAttribute("aria-label", label);
      slider.addEventListener("input", () => { output.value = formatValue(slider.value, digits, suffix); });
      slider.addEventListener("change", () => {
        const value = Number(slider.value);
        send(action === "setting" ? { action, key, value } : { action, name: key, value });
      });
      wrap.append(slider, output);
      row.append(wrap);
      parent.append(row);
    }

    function formatValue(value, digits = 0, suffix = "") {
      const number = Number(value);
      return `${number.toFixed(digits)}${suffix ? ` ${suffix}` : ""}`;
    }

    function buildViews(state) {
      const views = document.getElementById("views");
      views.replaceChildren();
      for (const [key, title] of Object.entries(viewNames)) {
        const pane = element("section", `view${key === activeView ? " active" : ""}`);
        pane.dataset.pane = key;
        pane.setAttribute("aria-label", title);
        const heading = element("div", "section-heading");
        heading.append(element("h2", "", title));
        heading.append(element("span", "section-index", `SETTINGS / 0${Object.keys(viewNames).indexOf(key) + 1}`));
        pane.append(heading);
        views.append(pane);
      }

      const detection = views.querySelector('[data-pane="detection"]');
      const detectGroup = group(detection, "Object classes");
      detectionToggles.forEach(name => toggleRow(detectGroup, name, name));
      const imageGroup = group(detection, "Image");
      toggleRow(imageGroup, "Monochrome display", "Monochrome display");
      toggleRow(imageGroup, "Calibration mode", "Calibration mode");
      rangeRow(imageGroup, "Prediction horizon", "future_seconds", .1, 5, .1, "s", 1);

      const camera = views.querySelector('[data-pane="camera"]');
      const formatGroup = group(camera, "Capture mode");
      const modeRow = element("div", "setting-row");
      modeRow.append(element("label", "setting-name", "Video format / resolution"));
      const modeSelect = document.createElement("select");
      modeSelect.dataset.cameraMode = "true";
      modeSelect.setAttribute("aria-label", "Video format and resolution");
      state.camera_modes.forEach((mode, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${mode.format} · ${mode.width} × ${mode.height} · ${mode.fps} fps`;
        modeSelect.append(option);
      });
      modeSelect.addEventListener("change", () => send({ action: "camera_mode", index: Number(modeSelect.value) }));
      modeRow.append(modeSelect);
      formatGroup.append(modeRow);

      const cameraGroup = group(camera, "Camera properties");
      const controlLabels = {
        brightness: "Brightness", contrast: "Contrast", saturation: "Saturation", hue: "Hue",
        gamma: "Gamma", white_balance_temperature: "White balance temperature", sharpness: "Sharpness",
        backlight_compensation: "Backlight compensation",
      };
      const controlEntries = Object.entries(state.camera_controls);
      controlEntries.filter(([name]) => name !== "white_balance_automatic").forEach(([name, control]) => {
        rangeRow(cameraGroup, controlLabels[name] || name.replaceAll("_", " "), name,
          control.min, control.max, 1, "", 0, "camera_control");
      });
      if (state.camera_controls.white_balance_automatic) {
        toggleRow(cameraGroup, "Automatic white balance", "white_balance_automatic", "camera_control");
      }
      toggleRow(cameraGroup, "Monochrome display", "Monochrome display");
      if (controlEntries.length === 0) cameraGroup.append(element("p", "empty", "No camera properties reported by this device."));

      const alerts = views.querySelector('[data-pane="alerts"]');
      const alertGroup = group(alerts, "Detection trigger");
      rangeRow(alertGroup, "Consecutive detections", "consecutive_frames", 1, 10, 1, "frames");
      rangeRow(alertGroup, "Confidence threshold", "confidence_threshold", .01, 1, .01, "", 2);
      const overlayGroup = group(alerts, "Aim and sound");
      rangeRow(overlayGroup, "Crosshair level", "crosshair_value", 0, 255, 1);
      rangeRow(overlayGroup, "Beep delay after alignment", "alignment_tone_delay", .1, 2, .1, "s", 2);
      const outputGroup = group(alerts, "Hardware output");
      toggleRow(outputGroup, "Enable GPIO LED", "Enable GPIO LED");
    }

    function updateViews(state) {
      document.querySelectorAll("[data-toggle]").forEach(button => {
        button.setAttribute("aria-checked", String(Boolean(state.toggles[button.dataset.toggle])));
      });
      document.querySelectorAll("[data-camera-toggle]").forEach(button => {
        const value = state.camera_controls[button.dataset.cameraToggle]?.value;
        button.setAttribute("aria-checked", String(Boolean(value)));
      });
      document.querySelectorAll("[data-setting]").forEach(slider => {
        const value = state.settings[slider.dataset.setting];
        if (document.activeElement !== slider) slider.value = value;
        const output = slider.parentElement.querySelector("output");
        const suffix = slider.dataset.setting === "future_seconds" ? "s"
          : slider.dataset.setting === "consecutive_frames" ? "frames"
          : slider.dataset.setting === "alignment_tone_delay" ? "s" : "";
        const digits = ["future_seconds", "confidence_threshold", "alignment_tone_delay"].includes(slider.dataset.setting) ? 2 : 0;
        output.value = formatValue(slider.value, digits, suffix);
      });
      document.querySelectorAll("[data-camera-control]").forEach(slider => {
        const value = state.camera_controls[slider.dataset.cameraControl]?.value;
        if (value === undefined) return;
        if (document.activeElement !== slider) slider.value = value;
        slider.parentElement.querySelector("output").value = formatValue(slider.value);
      });
      const modeSelect = document.querySelector("[data-camera-mode]");
      if (modeSelect && document.activeElement !== modeSelect) modeSelect.value = state.camera_mode_index;
      const mode = state.camera_mode;
      document.getElementById("camera-readout").textContent = `${mode.width} × ${mode.height} / ${mode.fps} fps`;
      const led = state.led;
      document.getElementById("led-status").textContent = `GPIO LED / ${led.enabled ? "ACTIVE" : "OFF"}`;
      document.getElementById("link-status").textContent = led.message || "Control link active";
      document.getElementById("updated-at").textContent = `UPDATED ${new Date().toLocaleTimeString()}`;
    }

    async function send(command) {
      try {
        const response = await fetch("/api/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(command),
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(result.error || "Setting was rejected");
        }
        showToast("Setting applied");
        await refresh();
      } catch (error) {
        showToast(error.message || "Could not reach the device");
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("visible"), 2200);
    }

    async function refresh() {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) throw new Error("Device unavailable");
        const state = await response.json();
        if (!state.camera_modes) throw new Error("Waiting for camera state");
        latestState = state;
        if (!document.querySelector("[data-pane]")) buildViews(state);
        updateViews(state);
        document.getElementById("connection").className = "connection online";
        document.getElementById("connection-label").textContent = "DEVICE ONLINE";
      } catch (error) {
        document.getElementById("connection").className = "connection offline";
        document.getElementById("connection-label").textContent = "DEVICE OFFLINE";
      }
    }

    document.querySelectorAll("[data-view]").forEach(button => {
      button.addEventListener("click", () => {
        activeView = button.dataset.view;
        document.querySelectorAll("[data-view]").forEach(tab => tab.setAttribute("aria-selected", String(tab === button)));
        document.querySelectorAll("[data-pane]").forEach(pane => pane.classList.toggle("active", pane.dataset.pane === activeView));
        document.getElementById("view-title").textContent = viewNames[activeView];
      });
    });
    document.getElementById("device-host").textContent = location.host;
    refresh();
    setInterval(refresh, 900);
  </script>
</body>
</html>
